<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KT INDEX — 킬팀 팩션 색인</title>
    <meta
      name="description"
      content="킬팀 팩션 9개 · 킬팀 48개 · 요원 492명을 한 곳에서 찾아보는 색인."
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
  </head>
  <body>
    <header class="shell">
      <nav class="topbar" aria-label="주 메뉴">
        <a class="topbar__mark" href="index.html">KT INDEX <span>41M</span></a>
        <div class="topbar__nav">
          <a href="index.html" aria-current="page">팩션</a>
          <a href="#kill-teams">킬팀</a>
        </div>
      </nav>
    </header>

    <main class="shell" id="page">
      <section class="hero" aria-labelledby="hero-heading">
        <p class="eyebrow">Kill Team · Faction Dossier</p>
        <h1 class="hero__title" id="hero-heading">
          킬팀
          <em>팩션 색인</em>
        </h1>
        <p class="hero__lede">
          팩션 · 킬팀 · 요원 · 플로이 · 장비 · 편성 가이드를 한 곳에 모았습니다.
          이름은 한글(영어)로 함께 적고, 설명은 한글로 정리합니다.
        </p>
        <div class="hero__stats" id="hero-stats"></div>
      </section>

      <div class="hazard-rule" role="presentation"></div>

      <section class="section" aria-labelledby="factions-heading">
        <div class="section__head">
          <h2 id="factions-heading">팩션</h2>
          <span class="section__count">9개</span>
        </div>
        <div class="faction-grid" id="faction-grid"></div>
      </section>

      <section class="section" id="kill-teams" aria-labelledby="teams-heading">
        <div class="section__head">
          <h2 id="teams-heading">킬팀 전체</h2>
          <span class="section__count" id="team-count">–</span>
        </div>

        <div class="search">
          <label for="search-input">검색</label>
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            placeholder="죽음의 천사, Angels of Death, IMP-AOD, Recon…"
          />
        </div>

        <div class="team-grid" id="team-results" style="margin-top: 1.5rem"></div>
      </section>
    </main>

    <footer class="shell footer" id="site-footer"></footer>

    <script src="data/kt-data.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/page-index.js"></script>
  </body>
</html>
